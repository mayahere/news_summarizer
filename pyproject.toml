[project]
name = "news-agent"
version = "0.2.0"
description = "Crawl tin tức từ báo điện tử Việt Nam bằng Scrapy, phân loại chủ đề, xuất JSON"
readme = "README.md"
authors = [
    { name = "May Tran", email = "133972368+mayahere@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "parsel>=1.12.1",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "scrapy>=2.19.0",
    "scrapy-playwright>=0.0.48",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "tzdata>=2026.5",
]

[project.scripts]
news-agent = "news_agent.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "lxml-stubs>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_agent"]

# ---------- ruff: linter + formatter ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scrapy_playwright.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
